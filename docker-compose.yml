services:
  postgres:
    image: postgres:16-alpine
    container_name: sareyboth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sareyboth_studio
    ports:
      - "5432:5432"
    volumes:
      - sareyboth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sareyboth_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sareyboth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sareyboth_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sareyboth_pgdata:
  sareyboth_redisdata:
